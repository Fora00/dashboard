# Daily events crawl + deploy. Also runnable by hand (Actions tab > Run workflow).
name: Crawl events and deploy

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if the crawler guards refuse (big drop, unreadable previous file)'
        type: boolean
        default: false
  schedule:
    # ~06:23 Rome; GitHub cron is UTC and may run late.
    - cron: '23 4 * * *'

# Per job below: only the deploy gets Pages rights, only the health job may
# write issues.
permissions:
  contents: read

# Shared with deploy.yml, never cancelling: see the comment there. A crawl
# queued behind a running deploy waits (seconds); a crawl that is running is
# never cancelled by a push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/_site.yml
    with:
      events: crawl
      events_force: ${{ inputs.force == true }}
    secrets: inherit

  # Surfaces a degraded crawl in the run itself (annotation + job summary). It
  # deliberately creates nothing on GitHub (no issues, no notifications): the
  # owner wants everything to stay local. Reasons come from
  # scripts/events/health.ts degradedReasons; docs/CI.md.
  health:
    needs: site
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      HEALTH: ${{ needs.site.outputs.crawl_health }}
      RESULT: ${{ needs.site.result }}
    steps:
      - name: Summarise crawl health
        shell: bash
        run: |
          reasons="$HEALTH"
          if [ "$RESULT" != success ]; then
            reasons="crawl-deploy job: $RESULT, nothing deployed${reasons:+; $reasons}"
          fi
          if [ -n "$reasons" ]; then
            echo "::warning title=Events crawl needs attention::$reasons"
            echo "### Events crawl needs attention" >> "$GITHUB_STEP_SUMMARY"
            echo "$reasons" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Crawl healthy." >> "$GITHUB_STEP_SUMMARY"
          fi
