# UI deploy on every push to main. Does NOT crawl: it reuses the published
# events.json (see _site.yml), so it takes seconds. The daily crawl lives in
# crawl.yml.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Same group as crawl.yml: only one Pages deploy at a time. NEVER cancel a
# running deploy: a push must not be able to kill the daily crawl-deploy
# mid-flight (and vice versa). With cancel-in-progress false GitHub keeps one
# running + one pending run; a newer push replaces an older *pending* push,
# which is what we want (the latest commit wins).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    uses: ./.github/workflows/_site.yml
    with:
      events: reuse
    secrets: inherit
